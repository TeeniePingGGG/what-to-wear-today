# 로컬 개발용 MySQL — `docker compose up -d` 로 실행
services:
  mysql:
    image: mysql:8.0
    container_name: wear-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: wear
      MYSQL_USER: wear
      MYSQL_PASSWORD: wear1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwear", "-pwear1234"]
      interval: 5s
      retries: 10

volumes:
  mysql-data:
